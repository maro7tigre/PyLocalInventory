<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none;}
#erd svg.erDiagram text { fill: #000 !important; }
#erd svg .label,
#erd svg .nodeLabel,
#erd svg foreignObject p,
#erd svg foreignObject span {
  color: #000000 !important;
}
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: '#000000',
  },
});
const src = `erDiagram
  ROLE ||--o{ UTILISATEUR : possede
  ROLE ||--o{ DROIT_ACCES : definit
  FOURNISSEUR ||--o{ IMPORT : fournit
  IMPORT ||--o{ LIGNE_IMPORT : contient
  PRODUIT ||--o{ LIGNE_IMPORT : concerne
  CLIENT ||--o{ VENTE : passe
  VENTE ||--o{ LIGNE_VENTE : contient
  PRODUIT ||--o{ LIGNE_VENTE : concerne
  SERVICE ||--o{ LIGNE_VENTE : concerne
  VENTE ||--o{ PAIEMENT : reglee_par
  LIGNE_VENTE ||--o{ PAIEMENT : reglee_par
  IMPORT ||--o{ PAIEMENT : reglee_par
  LIGNE_IMPORT ||--o{ PAIEMENT : reglee_par
  CLIENT ||--o{ PAIEMENT : effectue
  UTILISATEUR ||--o{ IMPORT : cree
  UTILISATEUR ||--o{ VENTE : cree
  UTILISATEUR ||--o{ PRODUIT : cree
  UTILISATEUR ||--o{ CLIENT : cree
  UTILISATEUR ||--o{ SERVICE : cree
  UTILISATEUR ||--o{ RAPPORT : cree

  ROLE {
    int id
    string name
  }
  DROIT_ACCES {
    string section
    bool can_read
    bool can_write
    bool can_delete
  }
  UTILISATEUR {
    int id
    string username
    string password_hash
    bool is_superadmin
  }
  CLIENT {
    int id
    string username
    string name
    string client_type
    string address
    string email
    string phone
    string ice
  }
  FOURNISSEUR {
    int id
    string username
    string name
    string address
    string email
    string phone
  }
  PRODUIT {
    int id
    string name
    float unit_price
    float sale_price
    string category
    int stock_alert
  }
  SERVICE {
    int id
    string service_type
    string name
    float unit_price
  }
  IMPORT {
    int id
    date date
    float tva
    string bl_number
    bool is_historical
  }
  LIGNE_IMPORT {
    int id
    int quantity
    float unit_price
  }
  VENTE {
    int id
    string state
    date date
    float tva
    bool devis
    float remise
  }
  LIGNE_VENTE {
    int id
    int quantity
    float unit_price
    string item_type
  }
  PAIEMENT {
    int id
    float amount
    date date
  }
  RAPPORT {
    int id
    string department
    string report_type
  }
  ATTACHMENT {
    int id
    string entity_type
    string display_name
    string category
  }
  JOURNAL {
    int seq
    string section
    string operation
  }
  META {
    string key
    string value
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;
// Ensure SVG text nodes have an explicit fill so they remain readable
const _svgRoot = document.getElementById('erd').querySelector('svg');
if (_svgRoot) {
  // Force all text to be black and opaque
  _svgRoot.querySelectorAll('text, tspan').forEach(el => {
    el.removeAttribute('style');
    el.setAttribute('fill', '#000000');
    el.setAttribute('opacity', '1');
    el.style.setProperty('fill', '#000000', 'important');
  });
  // Also fix any g elements that might contain text
  _svgRoot.querySelectorAll('g').forEach(el => {
    if (el.querySelector('text, tspan')) {
      el.style.setProperty('fill', '#000000', 'important');
    }
  });
  _svgRoot.querySelectorAll('foreignObject, foreignObject *').forEach(el => {
    el.style.setProperty('color', '#000000', 'important');
  });
}

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
