<style>
#erd4 svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd4 svg.erDiagram .row-rect-odd path,
#erd4 svg.erDiagram .row-rect-odd rect,
#erd4 svg.erDiagram .row-rect-even path,
#erd4 svg.erDiagram .row-rect-even rect { stroke: none; }
#erd4 svg.erDiagram text { fill: #000 !important; }
#erd4 svg .label,
#erd4 svg .nodeLabel,
#erd4 svg foreignObject p,
#erd4 svg foreignObject span {
  color: #000000 !important;
}
</style>
<div id="erd4"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
try {
const src = `erDiagram
  roles ||--o{ users : role_id
  roles ||--o{ rolepermissions : role_id
  suppliers ||--o{ imports : supplier_id
  imports ||--o{ import_items : import_id
  products ||--o{ import_items : product_id
  clients ||--o{ sales : client_id
  sales ||--o{ sales_items : sales_id
  products ||--o{ sales_items : product_id
  services ||--o{ sales_items : service_id
  sales ||--o{ payments : sale_id
  sales_items ||--o{ payments : sales_item_id
  imports ||--o{ payments : import_id
  import_items ||--o{ payments : import_item_id
  clients ||--o{ payments : client_id
  users ||--o{ imports : created_by
  users ||--o{ sales : created_by
  users ||--o{ products : created_by
  users ||--o{ clients : created_by
  users ||--o{ services : created_by
  users ||--o{ reports : created_by

  roles {
    serial id PK
    varchar(100) name
  }
  rolepermissions {
    int role_id PK, FK
    varchar(50) section PK
    boolean can_read "default false"
    boolean can_write "default false"
    boolean can_delete "default false"
  }
  users {
    serial id PK
    varchar(50) username UK
    text password_hash
    varchar(64) salt
    int role_id FK
    boolean is_superadmin "default false"
  }
  clients {
    serial id PK
    varchar(100) username
    varchar(150) name
    varchar(30) client_type
    text address
    varchar(100) email
    varchar(30) phone
    text notes
    text preview_image
    varchar(30) ice
    int created_by FK
    varchar(50) created_by_username
    timestamp created_at "default now()"
  }
  suppliers {
    serial id PK
    varchar(100) username
    varchar(150) name
    text address
    varchar(100) email
    varchar(30) phone
    text notes
    text preview_image
  }
  products {
    serial id PK
    varchar(100) username
    varchar(150) name
    numeric(10,2) unit_price
    numeric(10,2) sale_price
    text preview_image
    varchar(50) category
    text description
    int stock_alert
    int created_by FK
    varchar(50) created_by_username
    timestamp created_at "default now()"
  }
  services {
    serial id PK
    varchar(50) service_type
    varchar(150) name
    text description
    text keywords
    numeric(10,2) unit_price
    int created_by FK
    varchar(50) created_by_username
    timestamp created_at "default now()"
  }
  wood_types {
    serial id PK
    varchar(100) name
  }
  door_types {
    serial id PK
    varchar(100) name
    int serial_num
    text image_path
  }
  imports {
    serial id PK
    varchar(100) supplier_username
    varchar(150) supplier_name
    date date
    numeric(5,2) tva
    text notes
    int created_by FK
    varchar(50) created_by_username
    timestamp created_at "default now()"
    uuid operation_token
    int supplier_id FK
    varchar(50) bl_number
    boolean is_historical "default false"
  }
  import_items {
    serial id PK
    int import_id FK
    int product_id FK
    varchar(150) product_name
    numeric(10,2) quantity
    numeric(10,2) unit_price
  }
  sales {
    serial id PK
    varchar(30) state
    varchar(100) client_username
    varchar(150) client_name
    date date
    numeric(5,2) tva
    text notes
    int client_id FK
    boolean devis "default false"
    numeric(5,2) remise
    int created_by FK
    varchar(50) created_by_username
    timestamp created_at "default now()"
    uuid operation_token
    boolean is_historical "default false"
    varchar(50) devis_number
  }
  sales_items {
    serial id PK
    int sales_id FK
    int product_id FK
    varchar(150) product_name
    text information
    numeric(10,2) quantity
    numeric(10,2) unit_price
    text production
    int service_id FK
    varchar(20) item_type
    int sort_order
  }
  payments {
    serial id PK
    int sale_id FK
    numeric(10,2) amount
    date date
    int sales_item_id FK
    int import_id FK
    int import_item_id FK
    int client_id FK
  }
  reports {
    serial id PK
    varchar(100) department
    date date
    text report
    varchar(50) report_type
    int created_by FK
    varchar(50) created_by_username
    timestamp created_at "default now()"
  }
  attachments {
    serial id PK
    varchar(50) entity_type
    int entity_id
    varchar(255) original_filename
    varchar(255) display_name
    text description
    varchar(50) category
    varchar(100) mime_type
    bigint file_size
    text relative_path
    timestamp created_at "default now()"
    timestamp modified_at
  }
  change_log {
    bigserial seq PK
    varchar(50) section
    int row_id
    varchar(20) operation
    jsonb payload
    timestamp created_at "default now()"
  }
  meta {
    varchar(100) key PK
    text value
  }`;
const { svg } = await mermaid.render('erd4-svg', src);
document.getElementById('erd4').innerHTML = svg;

document.querySelectorAll('#erd4 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd4 svg.erDiagram .row-rect-odd path, #erd4 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
} catch (e) {
  document.getElementById('erd4').innerHTML = '<div style="color:var(--text-danger);font-size:13px">Render error: ' + e.message + '</div>';
}
</script>
