<style>
#erd3 svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd3 svg.erDiagram .row-rect-odd path,
#erd3 svg.erDiagram .row-rect-odd rect,
#erd3 svg.erDiagram .row-rect-even path,
#erd3 svg.erDiagram .row-rect-even rect { stroke: none; }
#erd3 svg.erDiagram text { fill: #000 !important; }
#erd3 svg .label,
#erd3 svg .nodeLabel,
#erd3 svg foreignObject p,
#erd3 svg foreignObject span {
  color: #000000 !important;
}
</style>
<div id="erd3"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: '#000000',
  },
});
try {
const src = `erDiagram
  ROLES ||--o{ USERS : role_id
  ROLES ||--o{ ROLEPERMISSIONS : role_id
  SUPPLIERS ||--o{ IMPORTS : supplier_id
  IMPORTS ||--o{ IMPORT_ITEMS : import_id
  PRODUCTS ||--o{ IMPORT_ITEMS : product_id
  CLIENTS ||--o{ SALES : client_id
  SALES ||--o{ SALES_ITEMS : sales_id
  PRODUCTS ||--o{ SALES_ITEMS : product_id
  SERVICES ||--o{ SALES_ITEMS : service_id
  SALES ||--o{ PAYMENTS : sale_id
  SALES_ITEMS ||--o{ PAYMENTS : sales_item_id
  IMPORTS ||--o{ PAYMENTS : import_id
  IMPORT_ITEMS ||--o{ PAYMENTS : import_item_id
  CLIENTS ||--o{ PAYMENTS : client_id
  USERS ||--o{ IMPORTS : created_by
  USERS ||--o{ SALES : created_by
  USERS ||--o{ PRODUCTS : created_by
  USERS ||--o{ CLIENTS : created_by
  USERS ||--o{ SERVICES : created_by
  USERS ||--o{ REPORTS : created_by

  ROLES {
    int id PK
    string name
  }
  ROLEPERMISSIONS {
    int role_id PK, FK
    string section PK
    bool can_read
    bool can_write
    bool can_delete
  }
  USERS {
    int id PK
    string username
    string password_hash
    string salt
    int role_id FK
    bool is_superadmin
  }
  CLIENTS {
    int id PK
    string username
    string name
    string client_type
    string address
    string email
    string phone
    string ice
    int created_by FK
  }
  SUPPLIERS {
    int id PK
    string username
    string name
    string address
    string email
    string phone
  }
  PRODUCTS {
    int id PK
    string name
    float unit_price
    float sale_price
    string category
    int stock_alert
    int created_by FK
  }
  SERVICES {
    int id PK
    string service_type
    string name
    float unit_price
    int created_by FK
  }
  WOOD_TYPES {
    int id PK
    string name
  }
  DOOR_TYPES {
    int id PK
    string name
    int serial
    string image_path
  }
  IMPORTS {
    int id PK
    date date
    float tva
    int created_by FK
    int supplier_id FK
    string bl_number
    bool is_historical
  }
  IMPORT_ITEMS {
    int id PK
    int import_id FK
    int product_id FK
    int quantity
    float unit_price
  }
  SALES {
    int id PK
    string state
    date date
    float tva
    int client_id FK
    bool devis
    float remise
    int created_by FK
    bool is_historical
  }
  SALES_ITEMS {
    int id PK
    int sales_id FK
    int product_id FK
    int quantity
    float unit_price
    int service_id FK
    string item_type
  }
  PAYMENTS {
    int id PK
    int sale_id FK
    float amount
    date date
    int sales_item_id FK
    int import_id FK
    int import_item_id FK
    int client_id FK
  }
  REPORTS {
    int id PK
    string department
    date date
    string report_type
    int created_by FK
  }
  ATTACHMENTS {
    int id PK
    string entity_type
    int entity_id
    string display_name
    string category
  }
  CHANGE_LOG {
    int seq PK
    string section
    int row_id
    string operation
  }
  META {
    string key PK
    string value
  }`;
const { svg } = await mermaid.render('erd3-svg', src);
document.getElementById('erd3').innerHTML = svg;
// Ensure SVG text nodes have an explicit fill so they remain readable
const _svgRoot = document.getElementById('erd3').querySelector('svg');
if (_svgRoot) {
  // Force all text to be black and opaque
  _svgRoot.querySelectorAll('text, tspan').forEach(el => {
    el.removeAttribute('style');
    el.setAttribute('fill', '#000000');
    el.setAttribute('opacity', '1');
    el.style.setProperty('fill', '#000000', 'important');
  });
  // Also fix any g elements that might contain text
  _svgRoot.querySelectorAll('g').forEach(el => {
    if (el.querySelector('text, tspan')) {
      el.style.setProperty('fill', '#000000', 'important');
    }
  });
  
}

document.querySelectorAll('#erd3 svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd3 svg.erDiagram .row-rect-odd path, #erd3 svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
} catch (e) {
  document.getElementById('erd3').innerHTML = '<div style="color:var(--text-danger);font-size:13px">Render error: ' + e.message + '</div>';
}
</script>
